dcpas_chatbot.settings:
  type: config_object
  label: 'DCPAS Chatbot settings'
  mapping:
    enabled:
      type: boolean
      label: 'Chatbot enabled'
    provider:
      type: string
      label: 'API provider (openai or azure)'
    openai_api_key:
      type: string
      label: 'API key (fallback — prefer DCPAS_OPENAI_API_KEY env var)'
    openai_api_base:
      type: string
      label: 'API base URL (must be https://)'
    openai_api_version:
      type: string
      label: 'Azure API version (leave blank for standard OpenAI)'
    embedding_model:
      type: string
      label: 'Embedding model or deployment name'
    chat_model:
      type: string
      label: 'Chat model or deployment name'
    top_k:
      type: integer
      label: 'Number of retrieved chunks (top-K)'
    min_score:
      type: float
      label: 'Minimum cosine similarity score (0–1)'
    max_response_tokens:
      type: integer
      label: 'Maximum response tokens'
    api_timeout:
      type: integer
      label: 'API request timeout in seconds'
    system_prompt:
      type: string
      label: 'System prompt (max 2000 chars)'
    rate_limit_window:
      type: integer
      label: 'Rate limit window (seconds)'
    rate_limit_max:
      type: integer
      label: 'Max requests per window per user'
    chatbot_title:
      type: string
      label: 'Chatbot widget title'
    placeholder_text:
      type: string
      label: 'Input placeholder text'
    vector_store_backend:
      type: string
      label: 'Vector store backend (sqlite or pgvector)'
    max_chunks:
      type: integer
      label: 'Max corpus chunks loaded into PHP memory (memory safety cap, SQLite only)'
    manifest_path:
      type: string
      label: 'Filesystem path to index-manifest.json (ingestion pipeline output)'
