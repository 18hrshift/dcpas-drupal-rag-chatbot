services:

  logger.channel.dcpas_chatbot:
    parent: logger.channel_base
    arguments: ['dcpas_chatbot']

  dcpas_chatbot.azure_client:
    class: Drupal\dcpas_chatbot\Service\AzureOpenAIClient
    arguments:
      - '@config.factory'
      - '@http_client'

  # SQLite backend — in-process cosine similarity (default).
  dcpas_chatbot.sqlite_vector_store:
    class: Drupal\dcpas_chatbot\Service\SqliteVectorStore
    arguments:
      - '@database'
      - '@config.factory'
      - '@logger.channel.dcpas_chatbot'

  # pgvector backend — PostgreSQL ANN search (production scale).
  # Requires: PostgreSQL default DB, pgvector extension, migration run.
  # See DEPLOY.md § pgvector Setup.
  dcpas_chatbot.pg_vector_store:
    class: Drupal\dcpas_chatbot\Service\PgVectorStore
    arguments:
      - '@database'
      - '@config.factory'
      - '@logger.channel.dcpas_chatbot'

  # Active vector store — routes to sqlite or pgvector based on config.
  # All consumers (Retriever, SettingsForm, DcpasChatbotCommands) use this.
  dcpas_chatbot.vector_store:
    class: Drupal\dcpas_chatbot\Service\VectorStoreLocator
    arguments:
      - '@dcpas_chatbot.sqlite_vector_store'
      - '@dcpas_chatbot.pg_vector_store'
      - '@config.factory'

  dcpas_chatbot.retriever:
    class: Drupal\dcpas_chatbot\Service\Retriever
    arguments:
      - '@dcpas_chatbot.vector_store'
      - '@dcpas_chatbot.azure_client'
      - '@config.factory'

  dcpas_chatbot.prompt_builder:
    class: Drupal\dcpas_chatbot\Service\PromptBuilder
    arguments:
      - '@config.factory'

  dcpas_chatbot.commands:
    class: Drupal\dcpas_chatbot\Commands\DcpasChatbotCommands
    arguments:
      - '@config.factory'
      - '@dcpas_chatbot.vector_store'
    tags:
      - { name: drush.command }
