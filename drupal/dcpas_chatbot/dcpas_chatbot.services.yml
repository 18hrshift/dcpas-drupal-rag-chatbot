services:

  dcpas_chatbot.azure_client:
    class: Drupal\dcpas_chatbot\Service\AzureOpenAIClient
    arguments:
      - '@config.factory'
      - '@http_client'

  dcpas_chatbot.vector_store:
    class: Drupal\dcpas_chatbot\Service\VectorStore
    arguments:
      - '@database'
      - '@config.factory'
      - '@logger.channel.dcpas_chatbot'

  dcpas_chatbot.retriever:
    class: Drupal\dcpas_chatbot\Service\Retriever
    arguments:
      - '@dcpas_chatbot.vector_store'
      - '@dcpas_chatbot.azure_client'
      - '@config.factory'

  dcpas_chatbot.prompt_builder:
    class: Drupal\dcpas_chatbot\Service\PromptBuilder
    arguments:
      - '@config.factory'

  dcpas_chatbot.commands:
    class: Drupal\dcpas_chatbot\Commands\DcpasChatbotCommands
    arguments:
      - '@config.factory'
      - '@dcpas_chatbot.vector_store'
    tags:
      - { name: drush.command }
