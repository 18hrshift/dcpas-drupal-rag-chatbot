name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [develop, main]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pytest
        run: python3 -m pytest tests/ -v

  php-codestyle:
    name: PHP code style (Drupal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install phpcs + Drupal coding standards
        run: |
          composer global require squizlabs/php_codesniffer
          composer global require drupal/coder
          phpcs --config-set installed_paths ~/.composer/vendor/drupal/coder/coder_sniffer
      - name: Run phpcs
        run: phpcs --standard=Drupal --extensions=php,module,install,yml drupal/dcpas_chatbot/src/

  js-lint:
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install eslint
        run: npm install -g eslint
      - name: Run eslint
        run: eslint drupal/dcpas_chatbot/js/chatbot.js

  retrieval-eval:
    name: Retrieval evaluation (optional)
    runs-on: ubuntu-latest
    # Only run when the index artifact is available (CI_EVAL_INDEX secret is set).
    # In normal CI this job is skipped — it runs only when an indexed corpus
    # has been uploaded as a workflow artifact or the secret is configured.
    # Set CI_EVAL_ENABLED=true in repo secrets to activate this job.
    if: ${{ vars.CI_EVAL_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download index artifact
        uses: actions/download-artifact@v4
        with:
          name: dcpas-index
          path: data/
      - name: Run retrieval evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 ingestion/evaluate.py --verbose --strict
